<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300e5ff'><path d='M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FLOWSHIELD — Deterministic 2D hydrodynamic flood simulation and early warning command center with real-time hydraulic head propagation and OLS ETA prediction." />
    <title>FLOWSHIELD — Flood Telemetry & Early Warning Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Anti-flash: default to light theme for pristine FlowShield UI matching designs -->
    <script>
      (function(){
        var k='flowshield-theme';
        var s;
        try{s=localStorage.getItem(k)}catch(e){}
        if(s!=='light'&&s!=='dark'&&s!=='auto')s='light';
        var dark=s==='dark';
        document.documentElement.setAttribute('data-theme',dark?'dark':'light');
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
